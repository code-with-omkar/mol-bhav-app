name: API CI

# Builds and tests the API on every push to main / feature branches and on PRs into main, then:
# - Migration guard: if the EF model changed without a migration, generates one with the real `dotnet ef` tool
#   (named PendingModelChanges), uploads it as an artifact and fails, so a missing migration never reaches main.
# - Applies every migration to a real PostgreSQL and smoke-tests the running API (webhook inbox: dedup,
#   validation, retry of an unknown order).

on:
  push:
    branches: [main, "feature/**"]
    paths: ["api/**", ".github/workflows/api-ci.yml"]
  pull_request:
    branches: [main]
    paths: ["api/**", ".github/workflows/api-ci.yml"]

permissions:
  contents: read

concurrency:
  group: api-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_EF_VERSION: "10.0.12" # keep in step with MicrosoftPackagesVersion in api/Directory.Packages.props

jobs:
  build-test:
    name: Build, test, migrate, smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: api

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: molbhav_ci
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci -d molbhav_ci"
          --health-interval 5s --health-timeout 5s --health-retries 20

    env:
      # Throwaway CI values for a disposable database, not secrets.
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__MolBhav: "Host=localhost;Port=5432;Database=molbhav_ci;Username=ci;Password=ci"
      Jwt__SigningKey: "ci-design-time-only-signing-key-not-a-secret-0123456789abcdef"
      PGHOST: localhost
      PGPORT: "5432"
      PGDATABASE: molbhav_ci
      PGUSER: ci
      PGPASSWORD: ci

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: api/global.json

      - name: Restore
        run: dotnet restore MolBhav.sln

      - name: Build
        run: dotnet build MolBhav.sln --no-restore --configuration Release

      - name: Test
        run: >
          dotnet test MolBhav.sln --no-build --configuration Release
          --logger "trx;LogFileName=test-results.trx" --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: api/TestResults
          if-no-files-found: ignore

      - name: Install dotnet-ef
        run: dotnet tool install --global dotnet-ef --version "$DOTNET_EF_VERSION"

      - name: Check for model changes without a migration
        id: pending
        run: |
          if dotnet ef migrations has-pending-model-changes \
               -p src/MolBhav.Infrastructure -s src/MolBhav.Api --configuration Release --no-build; then
            echo "pending=false" >> "$GITHUB_OUTPUT"
          else
            echo "pending=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate the missing migration
        if: steps.pending.outputs.pending == 'true'
        run: >
          dotnet ef migrations add PendingModelChanges
          -p src/MolBhav.Infrastructure -s src/MolBhav.Api -o Persistence/Migrations
          --configuration Release --no-build

      - name: Upload generated migration
        if: steps.pending.outputs.pending == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: pending-migration
          path: |
            api/src/MolBhav.Infrastructure/Persistence/Migrations/*_PendingModelChanges.cs
            api/src/MolBhav.Infrastructure/Persistence/Migrations/*_PendingModelChanges.Designer.cs
            api/src/MolBhav.Infrastructure/Persistence/Migrations/MolBhavDbContextModelSnapshot.cs

      - name: Fail on missing migration
        if: steps.pending.outputs.pending == 'true'
        run: |
          echo "::error::The EF model has changes with no migration. A generated migration is attached as the 'pending-migration' artifact; rename it descriptively and commit it."
          exit 1

      - name: Apply all migrations to PostgreSQL
        run: |
          set -o pipefail
          ef() {
            if ! dotnet ef database update "$@" -p src/MolBhav.Infrastructure -s src/MolBhav.Api --configuration Release --no-build \
                 2>&1 | tee "$RUNNER_TEMP/migrate.log"; then
              # Surface the failure as annotations (readable without downloading logs).
              grep -iE "error|exception|failed|Npgsql|42[0-9A-Z]{3}|23[0-9]{3}" "$RUNNER_TEMP/migrate.log" | tail -15 \
                | while IFS= read -r line; do echo "::error title=migration::${line:0:900}"; done
              exit 1
            fi
          }

          # CI-ONLY SHIM (remove once fixed in the migrations): SeedMarketDistrictData references 36 state ids that
          # no migration creates, so a fresh database cannot be migrated. Stop just before it, insert placeholder
          # states for exactly the referenced ids, then continue.
          seed=src/MolBhav.Infrastructure/Persistence/Migrations/20260926121238_SeedMarketDistrictData.cs
          ef AddLocalizationModule
          grep -oE "'[0-9a-f-]{36}', '[0-9a-f-]{36}'" "$seed" | awk -F"'" '{print $4}' | sort -u \
            | awk '{ printf "INSERT INTO market.states (id, name, code, is_active, created_at_utc) VALUES (%c%s%c, %cCI placeholder state %d%c, %cCI%02d%c, TRUE, now()) ON CONFLICT DO NOTHING;\n", 39, $1, 39, 39, NR, 39, 39, NR, 39 }' \
            | psql -v ON_ERROR_STOP=1 -q
          echo "Placeholder states: $(psql -tAc 'SELECT count(*) FROM market.states')"

          ef

      - name: Start the API
        working-directory: api/src/MolBhav.Api
        env:
          WebhookInbox__PollingIntervalSeconds: "1"
        run: |
          nohup dotnet bin/Release/net10.0/MolBhav.Api.dll --urls http://127.0.0.1:5080 > "$RUNNER_TEMP/api.log" 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:5080/health/ready > /dev/null; then echo "API ready after ${i}s"; exit 0; fi
            sleep 1
          done
          echo "::error::API did not become ready"; tail -100 "$RUNNER_TEMP/api.log"; exit 1

      - name: Smoke test — webhook inbox
        run: |
          set -euo pipefail
          url=http://127.0.0.1:5080/api/v1/billing/webhook
          body='{"entity":"event","event":"payment.captured","payload":{"payment":{"entity":{"id":"pay_ci_1","order_id":"order_ci_unknown"}}}}'

          post() { curl -s -o /dev/null -w '%{http_code}' -X POST "$url" -H 'Content-Type: application/json' "$@"; }
          expect() { if [ "$1" != "$2" ]; then echo "::error::$3: expected $2, got $1"; exit 1; fi; echo "ok  $3"; }
          sql() { psql -tAq -c "$1"; }

          expect "$(post -H 'x-razorpay-event-id: evt_ci_1' -d "$body")" 200 "new event accepted"
          expect "$(post -H 'x-razorpay-event-id: evt_ci_1' -d "$body")" 200 "redelivery accepted"
          expect "$(post -d "$body")" 400 "missing event id rejected"
          expect "$(post -H 'x-razorpay-event-id: evt_ci_bad' -d '{"no_event":true}')" 200 "unreadable event acknowledged"

          expect "$(sql "SELECT count(*) FROM billing.webhook_inbox WHERE event_id = 'evt_ci_1'")" 1 "redelivery stored once"
          expect "$(sql "SELECT count(*) FROM billing.webhook_inbox WHERE event_id = 'evt_ci_bad'")" 0 "unreadable event not stored"

          # The processor (1 s poll) must try the unknown order, fail it as NotFound and schedule a retry — not drop it.
          for i in $(seq 1 30); do
            state=$(sql "SELECT attempt_count || '|' || coalesce(last_error, '') || '|' || (processed_at_utc IS NULL) || '|' || (parked_at_utc IS NULL) || '|' || (next_attempt_at_utc > now())
                         FROM billing.webhook_inbox WHERE event_id = 'evt_ci_1'")
            case "$state" in 1\|Subscription.NotFound*\|true\|true\|true) echo "ok  unknown order retried later: $state"; break ;; esac
            sleep 1
          done
          case "$state" in 1\|Subscription.NotFound*\|true\|true\|true) ;; *) echo "::error::unexpected inbox state: $state"; exit 1 ;; esac

          if grep -q "Webhook inbox batch failed" "$RUNNER_TEMP/api.log"; then
            echo "::error::processor batch failed"; grep -A20 "Webhook inbox batch failed" "$RUNNER_TEMP/api.log"; exit 1
          fi

          # The reconciliation sweep runs once at startup, so its candidate query has hit PostgreSQL by now.
          if grep -q "Payment reconciliation sweep failed" "$RUNNER_TEMP/api.log"; then
            grep -A12 "Payment reconciliation sweep failed" "$RUNNER_TEMP/api.log" \
              | while IFS= read -r line; do echo "::error title=reconciliation::${line:0:900}"; done
            exit 1
          fi
          echo "ok  reconciliation sweep ran without errors"

      - name: API log
        if: always()
        run: |
          [ -f "$RUNNER_TEMP/api.log" ] || exit 0
          tail -200 "$RUNNER_TEMP/api.log"
          grep -E "\[(ERR|FTL|CRI)\]|Exception|fail:" "$RUNNER_TEMP/api.log" | tail -15 \
            | while IFS= read -r line; do echo "::warning title=api-log::${line:0:900}"; done
