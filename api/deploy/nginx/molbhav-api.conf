# Nginx site for the API at molbhav-api.jagtech.in. Then:
#   sudo cp molbhav-api.conf /etc/nginx/sites-available/molbhav-api
#   sudo ln -s /etc/nginx/sites-available/molbhav-api /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Cloudflare terminates the public HTTPS; use Cloudflare's "Full (strict)" mode with an origin certificate
# (paths below) so traffic to this server is encrypted too. The API reads X-Forwarded-For / -Proto, so the
# Nginx address must be listed in ReverseProxy__KnownProxies__0.

server {
    listen 80;
    server_name molbhav-api.jagtech.in;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name molbhav-api.jagtech.in;

    ssl_certificate     /etc/ssl/cloudflare/molbhav-api.jagtech.in.pem;
    ssl_certificate_key /etc/ssl/cloudflare/molbhav-api.jagtech.in.key;

    # The CSV upload limit in the API is 10 MB; leave a little room for the form.
    client_max_body_size 12m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A slow gov-feed pull can keep a request open for a while.
        proxy_read_timeout 300s;
    }
}
