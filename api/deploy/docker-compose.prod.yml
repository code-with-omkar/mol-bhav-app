# Production stack for one Linux VPS (see docs/hosting-prerequisites.md).
# Nginx runs on the host and proxies to 127.0.0.1:8080; Postgres is reachable only from the API container.
#
# On the server:  cp .env.production.example .env   (fill it in, never commit it)
#                 docker compose -f docker-compose.prod.yml --env-file .env up -d
services:
  postgres:
    image: postgres:17-alpine
    container_name: molbhav-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: molbhav
      POSTGRES_USER: molbhav
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      TZ: UTC
    # No "ports": the database is not published to the host or the internet.
    volumes:
      - molbhav-pgdata:/var/lib/postgresql/data
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U molbhav -d molbhav"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    image: ${API_IMAGE:-molbhav-api:latest}
    container_name: molbhav-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__MolBhav: Host=postgres;Port=5432;Database=molbhav;Username=molbhav;Password=${POSTGRES_PASSWORD}
    # Only the host (Nginx) can reach the API.
    ports:
      - "127.0.0.1:8080:8080"
    networks: [backend]

networks:
  backend:

volumes:
  molbhav-pgdata:
